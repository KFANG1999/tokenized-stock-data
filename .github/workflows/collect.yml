# 备用采集：手动在网页上点击运行一次，结果提交回本仓库的 data/ 目录
# 日常的每 10 分钟采集由 Vultr 服务器上的 cron 负责（见 server/），
# GitHub 免费定时触发经常被推迟或丢弃，所以这里不再设置 schedule
name: collect

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect snapshot
        run: python collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data collector/address-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
